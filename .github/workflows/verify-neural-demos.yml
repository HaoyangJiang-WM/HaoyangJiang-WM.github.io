name: Verify Neural Equation Demos

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Check replay JavaScript syntax
        run: node --check public/neural-equation-demos/assets/memory.js
      - name: Verify public files and all confirmation replay datasets
        run: python3 public/neural-equation-demos/tools/verify_publication.py
      - name: Save verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: neural-demos-publication-check
          path: publication-verification.json
