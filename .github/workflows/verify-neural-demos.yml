name: Verify Neural Equation Demos

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Verify public HTML, assets and replay data
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, time, urllib.request, zlib
          root = pathlib.Path('public/neural-equation-demos')
          base = 'https://haoyangjiang-wm.github.io/neural-equation-demos/'
          checked = []
          def fetch(relative):
              url = base + relative
              last = None
              for attempt in range(8):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent':'Neural-Demos-Publication-Check','Cache-Control':'no-cache'})
                      with urllib.request.urlopen(req, timeout=25) as response:
                          assert response.status == 200, (url, response.status)
                          content = response.read()
                      assert content == (root / relative).read_bytes(), 'Published bytes differ: ' + relative
                      checked.append({'path':relative,'status':200,'sha256':hashlib.sha256(content).hexdigest()})
                      return content
                  except Exception as exc:
                      last = exc
                      time.sleep(5)
              raise RuntimeError(str(last))
          fetch('index.html')
          fetch('assets/site.css')
          fetch('assets/app.js')
          fetch('assets/icon.svg')
          fetch('benchmark-summary.csv')
          release = json.loads(fetch('release.json'))
          ids = ['0','1','2','30','31','32','33','40','41','42','43','50','51','52','53','6']
          encoded = ''.join(fetch('assets/data-' + i + '.txt').decode().strip() for i in ids)
          data = json.loads(zlib.decompress(base64.b64decode(encoded, validate=True)))
          assert set(data['tasks']) == {'duffing','delay','thermal'}
          assert data['seeds'] == [3011,3012,3013]
          for task in data['tasks'].values():
              assert len(task['truth']) == len(task['t'])
              for seed in data['seeds']:
                  for kind in task['kinds']:
                      pred = task['pred'][str(seed)][kind]
                      assert pred is None or len(pred) == len(task['t'])
          report = {'result':'PASS','url':base,'release':release,'verified_files':checked,'cases':list(data['tasks']),'seeds':data['seeds']}
          pathlib.Path('publication-verification.json').write_text(json.dumps(report,indent=2))
          print('PASS: public website returns HTTP 200; all',len(checked),'published files match the committed source; all three replay datasets decode correctly.')
          print('LIVE SITE:',base)
          PY
      - name: Save verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: neural-demos-publication-check
          path: publication-verification.json
